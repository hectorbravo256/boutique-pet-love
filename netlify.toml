[build.environment]
  NODE_VERSION = "20"

[build]
  command = "node scripts/test-build-guard.mjs && node ./node_modules/vite/bin/vite.js build"
  publish = "dist"

[functions]
  directory = "netlify/test-disabled-functions"

[build.edge_functions]
  directory = "netlify/test-disabled-edge"



[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/checkout"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/success"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/producto/*"
  to = "/index.html"
  status = 200

[[redirects]]
