[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gztsfbdtevhcskdztiiu.supabase.co; connect-src 'self' https://gztsfbdtevhcskdztiiu.supabase.co wss://gztsfbdtevhcskdztiiu.supabase.co; font-src 'self' data:; object-src 'none'; form-action 'self'; base-uri 'self'"
