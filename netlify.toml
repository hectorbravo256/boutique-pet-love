[build.environment]
  NODE_VERSION = "20"

[build]
  command = "node ./node_modules/vite/bin/vite.js build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/google-shopping.xml"
  to = "/.netlify/functions/google-shopping"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
