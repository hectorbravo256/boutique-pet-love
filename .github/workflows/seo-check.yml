name: SEO checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/seo-optimization]
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node --test tests/sitemap.test.js tests/google-shopping.test.js tests/catalog-status.test.js tests/product-html.test.js tests/home-html.test.js
      - run: npm run build
